[project]
name = "rag-enterprise-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yeji-jang", email = "yejijang940@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.2.0",
    "fastapi>=0.162.5",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.7.4",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.3",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-enterprise-api = "rag_enterprise_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
